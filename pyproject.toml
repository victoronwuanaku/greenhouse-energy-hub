[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "greenhouse-energy-hub-mpc"
version = "0.1.0"
description = "Rolling-horizon economic MPC for a multi-carrier greenhouse energy hub (electricity, heat, hydrogen)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viktor Onwuanaku" }]
dependencies = [
    "do-mpc>=5.1.1",
    "casadi>=3.7.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0", "ipykernel>=6.0", "nbconvert>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Narrowly silence only the known, non-actionable third-party warnings (do-mpc optional
# features + the NumPy 2.0 __array_wrap__ deprecation triggered via CasADi) so test output
# stays readable WITHOUT hiding future project or dependency warnings.
filterwarnings = [
    "ignore::UserWarning:do_mpc",
    "ignore:.*__array_wrap__.*:DeprecationWarning",
]

[tool.setuptools.packages.find]
where = ["src"]
